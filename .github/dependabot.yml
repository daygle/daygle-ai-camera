# Dependabot configuration for daygle-ai-camera.
#
# Keeps `requirements.txt` and `.github/workflows/*.yml` up to date with a
# weekly scan.
#
# Two mechanisms keep Dependabot inside the versions this project can actually
# run, and they are NOT interchangeable:
#
#   * A range ceiling (e.g. opencv-python-headless <6.0) only suppresses a PR
#     while the newest release still falls inside the range. Once a newer
#     release exists ABOVE the ceiling, Dependabot proposes rewriting the whole
#     specifier up to it (e.g. numpy <2.3 -> >=2.5.1,<2.6) -- the ceiling in
#     requirements.txt does not stop that.
#   * An `ignore` rule below is therefore required for any dependency whose
#     latest upstream release is deliberately out of reach. These are the hard
#     stops that keep the Pascal/Tesla-P4 constraints from being
#     bumped away by an auto-PR.
#
# An exact pin (e.g. ultralytics==..., or the nvidia-*-cu12 CUDA wheels) does
# NOT stop Dependabot on its own -- it still proposes a new pin at the latest
# release (e.g. nvidia-cuda-runtime-cu12 12.4.127 -> 12.9.79). Dependencies that
# must never be auto-bumped therefore also need an `ignore` rule below.

version: 2

updates:
  # --- Python runtime dependencies ----------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      # Monday is the common Dependabot default; staggered from github-actions
      # to avoid two waves landing in the inbox at the same time.
      day: "monday"
    # 13 direct deps at weekly cadence -- 5 keeps the review queue
    # manageable when several ranges open up at once.
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    ignore:
      # Hard stops (see the mechanism note at the top of this file). The
      # requirements.txt ceilings alone do not prevent these -- Dependabot would
      # otherwise rewrite the range up to the newest release, which is exactly
      # the update we must not take.
      #
      # numpy is held below 2.3 as a deliberate no-runtime-change freeze on the
      # detection stack (2.3+ is fine for the Python 3.11 floor, but bumping it
      # requires re-validating model export and Tesla P4 GPU inference).
      - dependency-name: "numpy"
        versions: [">=2.3"]
      # onnxruntime 1.21+ moves to a CUDA stack that drops Pascal (Tesla P4 /
      # compute capability 6.1) support. Hold below 1.21 to match the
      # onnxruntime-gpu>=1.18,<1.21 default in scripts/install_python_deps.sh.
      - dependency-name: "onnxruntime"
        versions: [">=1.21"]
      # The nvidia-*-cu12 CUDA userspace wheels in requirements-gpu-pascal.txt
      # are pinned to the CUDA 12.4 line because those exact versions still ship
      # Pascal (sm_61) cubins; CUDA 12.8+/12.9 wheels drop them, which silently
      # breaks GPU inference on the Tesla P4. They are updated only by hand via
      # docs/tesla-p4-gpu-setup.md, so ignore every version -- an exact pin does
      # not stop Dependabot from proposing 12.4.127 -> 12.9.x.
      - dependency-name: "nvidia-*-cu12"
    # Exact-pinned entries (e.g. ultralytics==8.4.113) still get Dependabot
    # PRs -- an exact pin does not stop Dependabot on its own; it simply
    # proposes a new pin at the latest release. That is intended here:
    # requirements.txt pins ultralytics to a reviewed known-good release and
    # says the pin is bumped only after checking the upstream release notes,
    # so the Dependabot PR is the review trigger. If an exact pin must never
    # be auto-bumped at all, it needs an `ignore` rule above (see the
    # nvidia-*-cu12 entries). Tight ranges that stay below the newest release
    # (e.g. bcrypt>=5.0,<6.0) still let Dependabot propose only safe interim
    # bumps.

  # --- GitHub Actions ------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      # Tuesday keeps action bumps a day away from pip bumps.
      day: "tuesday"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      # Collapse all action updates into a single PR per week so reviewers
      # see one coherent CI refactor instead of three nearly-identical PRs.
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
