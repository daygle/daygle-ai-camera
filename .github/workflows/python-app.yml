name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Rapid successive pushes to a PR branch cancel the superseded run instead of
# queueing duplicate matrix jobs (2 Python versions x full dep install).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 3.11 is the supported floor (see README); 3.13 matches the current
        # production servers.
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with ruff
      run: ruff check app/
    - name: Test with pytest
      run: pytest

  # Dashboard frontend (web/) and its node:test suites. ESLint enforces the
  # recommended correctness rules as ERRORS for web/: cross-script globals
  # are declared in WEB_SHARED_GLOBALS (eslint.config.js), cross-script
  # exports carry an explicit "ESLint: exported ..." marker, and ignored
  # catches follow the _err convention - so plain `eslint .` gates with no
  # warning baseline or --max-warnings pin needed.
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint with ESLint
      run: npm run lint
    - name: Test dashboard scripts with node:test
      run: npm test
