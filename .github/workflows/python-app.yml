name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default: CI only needs to read the repo. Jobs that need more
# (e.g. CodeQL) request it explicitly in their own workflow.
permissions:
  contents: read

# Cancel superseded runs on the same ref so rapid pushes don't queue redundant
# full-matrix builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        run: python -m pip install ruff==0.15.8

      # Gates production code (app/) on the Pyflakes rule set; see ruff.toml.
      - name: Ruff check
        run: ruff check app

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # install_python_deps.sh installs with --no-cache-dir, so setup-python's
      # pip cache is a no-op here. Cache the built virtualenv instead, keyed on
      # the exact interpreter version plus the dependency + install-script
      # hashes, so the heavy ML stack (onnxruntime, ultralytics, opencv) is only
      # rebuilt when one of those actually changes.
      - name: Cache virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup.outputs.python-version }}-${{ hashFiles('requirements.txt', 'scripts/install_python_deps.sh') }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel

      - name: Install Python dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          ./scripts/install_python_deps.sh .venv/bin/python requirements.txt
          .venv/bin/python -m pip install --no-cache-dir pytest

      - name: Compile app files
        run: .venv/bin/python -m compileall app

      - name: Run test suite
        run: .venv/bin/python -m pytest
