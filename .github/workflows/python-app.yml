name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Rapid successive pushes to a PR branch cancel the superseded run instead of
# queueing duplicate matrix jobs (2 Python versions x full dep install).
# Only on PRs: on main every commit needs its own verdict, and cancelling there
# marked merged commits "cancelled" (red) whenever the next merge or bot commit
# landed - and re-running an older commit's run cancelled the newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # No env block needed: the app no longer downloads a model at startup, so
    # tests never trigger a YOLO download/export. Model downloads stay
    # covered by the explicit endpoint tests.

    strategy:
      matrix:
        # 3.11 is the supported floor (see README); 3.13 matches the current
        # production servers.
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        # Reuse downloaded wheels between runs. The key is the hash of
        # requirements.txt (per Python version and OS), so a dependency change
        # starts a fresh cache.
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install ffmpeg
      # Real ffmpeg/ffprobe for the end-to-end prebuffer render regression
      # (tests/test_prebuffer_segment_durations.py), which fails rather than
      # skips under CI when they are missing.
      # Normally ~20s. A slow Ubuntu mirror once stalled this step for 24
      # minutes, so bound each network attempt, retry, and cap the step: a
      # stuck mirror now fails fast instead of holding the run hostage.
      timeout-minutes: 6
      run: |
        APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov pytest-xdist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with ruff
      run: ruff check app/ scripts/
    - name: Test with pytest
      # Spread the suite over every runner core (~7 min -> ~2.5 min).
      # --dist loadfile keeps each test file on one worker: tests/support.py
      # re-imports the app.* namespace per test, so interleaving files on a
      # worker can cross-contaminate (see CONTRIBUTING.md). Coverage is still
      # collected and floored via pytest.ini's addopts.
      run: pytest -n auto --dist loadfile

  # Dashboard frontend (web/) and its node:test suites. ESLint enforces the
  # recommended correctness rules as ERRORS for web/: cross-script globals
  # are declared in WEB_SHARED_GLOBALS (eslint.config.js), cross-script
  # exports carry an explicit "ESLint: exported ..." marker, and ignored
  # catches follow the _err convention - so plain `eslint .` gates with no
  # warning baseline or --max-warnings pin needed.
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint with ESLint
      run: npm run lint
    - name: Test dashboard scripts with node:test
      run: npm test
