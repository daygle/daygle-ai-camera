name: Dismiss suppressed CodeQL alerts

on:
  push:
    branches:
      - main
  schedule:
    # Weekly Monday 03:17 UTC, just after the CodeQL default-setup scan, so a
    # quiet week still reconciles alert state.
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Least privilege: read the checkout to inspect source, write security-events
# so the alerts API PATCH (dismiss) is authorized.
permissions:
  contents: read
  security-events: write

jobs:
  dismiss:
    name: Dismiss alerts carrying suppression comments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # GitHub code scanning (including default setup) records codeql[rule-id]
      # suppression comments in SARIF but does not change alert state from
      # them. This job reconciles state directly: for every open code-scanning
      # alert, if the line directly above the reported location carries a
      # matching ``codeql[<rule-id>]`` comment in the current source, the alert
      # is dismissed (reason: won't fix, comment: Suppressed via SARIF). It is
      # idempotent and runs on the default branch only.
      - name: Dismiss suppressed alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import subprocess
          import sys

          repo = os.environ["GITHUB_REPOSITORY"]

          def gh(*args: str) -> str:
              return subprocess.run(
                  ["gh", "api", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          alerts = json.loads(
              gh(f"/repos/{repo}/code-scanning/alerts", "--paginate",
                 "-f", "state=open", "-f", "per_page=100")
          )

          dismissed = []
          for alert in alerts:
              rule = alert.get("rule", {}).get("id")
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              physical = location.get("physical_location") or {}
              artifact = physical.get("artifact_location") or {}
              region = physical.get("region") or {}
              path = artifact.get("uri") or ""
              line = region.get("start_line")
              if not rule or not path or not line:
                  continue
              # The suppression comment must sit on the line directly above the
              # reported location and name the exact rule id.
              try:
                  with open(path, encoding="utf-8") as fh:
                      lines = fh.read().splitlines()
                  comment = lines[line - 2].strip() if line >= 2 else ""
              except (OSError, IndexError, UnicodeDecodeError):
                  continue
              if f"codeql[{rule}]" not in comment:
                  continue
              gh(
                  "-X", "PATCH",
                  f"/repos/{repo}/code-scanning/alerts/{alert['number']}",
                  "-f", "state=dismissed",
                  "-f", "dismissed_reason=won't fix",
                  "-f", "dismissed_comment=Suppressed via SARIF",
              )
              dismissed.append(f"#{alert['number']} {rule} {path}:{line}")

          if dismissed:
              print("Dismissed:")
              for entry in dismissed:
                  print(f"  {entry}")
          else:
              print("No open alerts carry a matching suppression comment.")
          EOF
