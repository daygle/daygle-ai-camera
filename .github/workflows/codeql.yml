name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly Monday 02:30 UTC so a full database scan runs even on quiet weeks.
    - cron: '30 2 * * 1'

# Least-privilege at the workflow level; the analyze job elevates only what it
# needs to upload results.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF results to the Security tab
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # security-and-quality adds maintainability/correctness queries on top
          # of the default security suite.
          queries: security-and-quality

      # Python is interpreted, so no build step is required (no autobuild).
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
