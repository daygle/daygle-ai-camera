<!doctype html>
<html lang="en">
<script>(function(){var t=localStorage.getItem("daygle.theme");if(t!=="dark")document.documentElement.classList.add("light");})()</script>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - Daygle AI Camera</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell page-stack">
    <header class="hero">
      <div>
        <p class="eyebrow">Account</p>
        <h1>Profile</h1>
        <p class="muted">Manage your display preferences and password.</p>
      </div>
    </header>

    <section class="card">
      <div class="settings-section-header">
        <div class="settings-section-icon">👤</div>
        <div>
          <h2>Profile Details</h2>
          <p class="settings-section-subtitle">Update your name, email, timezone, and date/time display preferences.</p>
        </div>
      </div>
      <div id="profileMessage" class="muted"></div>
      <div id="profileSummary" class="status-panel"></div>
      <form id="profileForm" class="form-grid">
        <label>
          <span>Username</span>
          <input name="username" placeholder="Username" required />
        </label>
        <label>
          <span>First Name</span>
          <input name="first_name" placeholder="First name" />
        </label>
        <label>
          <span>Last Name</span>
          <input name="last_name" placeholder="Last name" />
        </label>
        <label>
          <span>Email</span>
          <input name="email" type="email" placeholder="Email address" />
        </label>
        <label>
          <span>Current Password <span class="info-tip" data-tip="Required only when changing your username or email. Leave blank for other changes." title="Required only when changing your username or email. Leave blank for other changes." tabindex="0" aria-label="Help: Required only when changing your username or email. Leave blank for other changes."></span></span>
          <input name="current_password" type="password" placeholder="Required to change username or email" autocomplete="current-password" />
        </label>
        <label>
          <span>Timezone <span class="info-tip" data-tip="Used for all timestamps in the app. Default: Australia/Sydney" title="Used for all timestamps in the app. Default: Australia/Sydney" tabindex="0" aria-label="Help: Used for all timestamps in the app. Default: Australia/Sydney"></span></span>
          <input name="timezone" placeholder="e.g. Australia/Sydney" required /></label>
        <label>
          <span>Date Format <span class="info-tip" data-tip="How dates are displayed throughout the app. Default: Browser Locale" title="How dates are displayed throughout the app. Default: Browser Locale" tabindex="0" aria-label="Help: How dates are displayed throughout the app. Default: Browser Locale"></span></span>
          <select name="date_format">
            <option value="locale">Browser Locale</option>
            <option value="iso">YYYY-MM-DD</option>
            <option value="au">DD/MM/YYYY</option>
            <option value="us">MM/DD/YYYY</option>
          </select></label>
        <label>
          <span>Time Format <span class="info-tip" data-tip="12-hour shows AM/PM, 24-hour uses military time. Default: 24 Hour" title="12-hour shows AM/PM, 24-hour uses military time. Default: 24 Hour" tabindex="0" aria-label="Help: 12-hour shows AM/PM, 24-hour uses military time. Default: 24 Hour"></span></span>
          <select name="time_format">
            <option value="24h">24 Hour</option>
            <option value="12h">12 Hour</option>
          </select></label>
        <label>
          <span>Theme <span class="info-tip" data-tip="Choose your preferred appearance. System follows your device setting. Default: System" title="Choose your preferred appearance. System follows your device setting. Default: System" tabindex="0" aria-label="Help: Choose your preferred appearance. System follows your device setting. Default: S..."></span></span>
          <select name="theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select></label>
      </form>
      <div class="button-row">
        <button type="submit" form="profileForm">Save Profile</button>
      </div>
    </section>

    <section class="card">
      <div class="settings-section-header">
        <div class="settings-section-icon">🔑</div>
        <div>
          <h2>Change Password</h2>
          <p class="settings-section-subtitle">Update your account password. Choose a strong, unique password.</p>
        </div>
      </div>
      <form id="passwordForm" class="form-grid">
        <label>
          <span>Current Password</span>
          <input name="current_password" type="password" placeholder="Current password" autocomplete="current-password" required />
        </label>
        <label>
          <span>New Password <span class="info-tip" data-tip="Use at least 8 characters with a mix of letters, numbers, and symbols." title="Use at least 8 characters with a mix of letters, numbers, and symbols." tabindex="0" aria-label="Help: Use at least 8 characters with a mix of letters, numbers, and symbols."></span></span>
          <input name="new_password" type="password" placeholder="New password" autocomplete="new-password" required /></label>
        <label>
          <span>Confirm Password</span>
          <input name="confirm_password" type="password" placeholder="Confirm password" autocomplete="new-password" required />
        </label>
      </form>
      <div class="button-row">
        <button type="submit" form="passwordForm">Change Password</button>
      </div>
    </section>
  </main>
  <script src="/static/nav.js"></script>
  <script src="/static/utils.js"></script>
  <script src="/static/profile.js"></script>
</body>
</html>
