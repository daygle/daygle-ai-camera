<!doctype html>
<html lang="en">
<script>(function(){var t=localStorage.getItem("daygle.theme");if(t)document.documentElement.classList.add(t);})()</script>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playback - Daygle AI Camera</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell page-stack recordings-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Recorded Clip</p>
        <h1>Playback</h1>
        <p class="muted" id="videoModalSubtitle">Watch a recording and review its detection details.</p>
      </div>
      <div class="button-row">
        <a class="secondary" href="/recordings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          All Recordings
        </a>
        <a id="videoModalDownload" class="secondary" download hidden>Download</a>
      </div>
    </header>

    <section class="card">
      <div class="clip-player-wrap">
        <video id="clipPlayer" controls preload="metadata"></video>
        <canvas id="clipOverlay" class="clip-overlay" aria-hidden="true"></canvas>
      </div>
      <div id="clipTimeline" class="clip-timeline" hidden>
        <div id="clipTimelineBar" class="clip-timeline-bar" role="slider" tabindex="0"
             aria-label="Recording segments — click to seek" aria-valuemin="0" aria-valuenow="0"></div>
        <div id="clipTimelineLegend" class="clip-timeline-legend"></div>
      </div>
      <div class="clip-overlay-controls">
        <label class="toggle-control clip-overlay-toggle" for="clipOverlayToggle">
          <input id="clipOverlayToggle" type="checkbox" checked />
          <span>Object Overlay</span>
        </label>
      </div>
      <p id="clipPlayerStatus" class="muted"></p>
      <div id="recordingDetails" class="status-panel"></div>
    </section>
  </main>

  <script src="/static/nav.js"></script>
  <script src="/static/utils.js"></script>
  <script src="/static/overlay.js"></script>
  <script src="/static/recordings.js"></script>
</body>
</html>
