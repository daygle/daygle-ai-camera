# Minimal bootstrap config.
# Keep this file small; operational settings are managed in the web UI
# and merged with application defaults from app/settings.py.
server:
  host: 0.0.0.0
  port: 8080
  # Default false: the app keeps serving the configured host (e.g. 0.0.0.0)
  # even after a Cloudflare Tunnel token is configured, so LAN clients and
  # the tunnel coexist. Set to true to make a configured token bind the app
  # to 127.0.0.1 so the tunnel is the only ingress.
  tunnel_loopback_only: false

# Host-level tuning for the dashboard GPU health card. The warn threshold
# tints the card amber; the critical threshold turns it red. Defaults match
# the Tesla P4 (throttle ceiling ~90 C); tune for other NVIDIA cards. These
# are also editable in the Settings -> System -> GPU Health card.
system:
  gpu_temp_warn_c: 85
  gpu_temp_critical_c: 90

# Optional bootstrap settings for a headless Cloudflare Tunnel deployment.
# Prefer DAYGLE_CLOUDFLARED_TOKEN or the Settings UI so the token is not
# committed to this file.
cloudflare_tunnel:
  binary: cloudflared

auth:
  enabled: true

storage:
  database: data/daygle_ai_camera.sqlite3
