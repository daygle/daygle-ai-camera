[pytest]
testpaths = tests
# Coverage runs on every pytest invocation (locally and in CI). Drop these
# options if the extra seconds per run ever outweigh the visibility.
# --cov-fail-under floors coverage below the level the suite already achieves
# so regressions fail CI instead of being reported and ignored. CI installs a
# fresh dependency set (requirements.txt resolved at run time), so the floor is
# kept below the local pinned-lock level; raise it deliberately as coverage
# grows.
addopts = --cov=app --cov-report=term-missing --cov-fail-under=60
