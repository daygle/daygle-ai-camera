# Pre-commit hooks for Daygle AI Camera.
#
# The ruff hook mirrors the CI lint gate (.github/workflows/python-app.yml),
# which runs `ruff check app/ scripts/ tests/` under the Pyflakes ("F") rules
# selected in ruff.toml. scripts/ carries first-party tooling
# (evaluate_detection.py) and tests/ the suite itself; neither may rot outside
# the gate. Intentional "Pool-A" preload imports in tests/ are annotated (see
# ruff.toml).
#
# Install:  pip install pre-commit && pre-commit install
# Run once: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        # Auto-fix what ruff can (unused imports, unused variables, ...);
        # anything left unfixed fails the commit so CI never sees it first.
        args: [--fix]
        files: ^(app|scripts|tests)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
